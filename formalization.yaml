status:
  scope: >-
    Fourteen compared theorems over eight compared definitions: seven restated from openai/math's
    EvenBarker and CirculantHadamard challenge files and canon, the listed sequence of each odd
    length. Unconditional: for odd n, every Barker sequence of length n
    has n in {1, 3, 5, 7, 11, 13}, one exists exactly for those n, and it is the listed sequence of
    its length up to negation and alternation (a kernel enumeration of the 2^n sign patterns); for odd n, the values of the
    aperiodic autocorrelations, skew-symmetry, the folded identity, the doubling law and the run
    bounds of Schmidt and Willms's Lemmas 3 and 4; for even n > 2, 4 | n and a real circulant
    Hadamard matrix of order n (four_dvd_of_even and existsRealCirculantHadamard_of_even re-prove,
    in this environment, openai/math's four_dvd_length and existsRealCirculantHadamard_of_even_barker,
    and the circulant composition is the argument of its even_length_eq_two_or_four; what this
    entry adds is the odd half, the structure theorems and the uniqueness theorem). Conditional on the even-length classification, taken as an explicit
    hypothesis: Barker sequences of positive length exist exactly at 1, 2, 3, 4, 5, 7, 11, 13, and
    every Barker sequence has length at most 13; the same two, conditional on the statement that real
    circulant Hadamard matrices of positive order exist only at orders 1 and 4. Not claimed: the
    even-length classification and the circulant Hadamard statement themselves; Turyn and Storer's
    Theorem 1. The intentional placeholders of
    Challenge.lean are excluded from proof counts; Solution.lean does not import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OddBarker.odd_length_mem"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "OddBarker.odd_exists_iff"
