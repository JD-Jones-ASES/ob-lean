automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout:
        the recast of the Schmidt–Willms proof, the Lean proofs, the literature and prior-art searches,
        the checkers and the repository text. Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit
        065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest and lake update
        is never run; there are no GitHub Actions workflows. There is no native_decide. The classification
        enumerates no sequences (n = 9 is excluded by the argument): decide proves only the eight
        witnesses and the forged control there, and the uniqueness theorem is proved by six decide
        +kernel enumerations of every ±1 list of length n at the six odd lengths (8,192 lists at
        n = 13); the rest is big-operator rewriting, ring and linear_combination identities, and
        omega over residues and divisibility.
      spend_usd: "not tracked"
      notes: "See DISCLOSURE.md."

fidelity:
  divergences: >-
    Seven of the eight definitions are openai/math's, character for character, in the namespace OddBarker
    (canon, the listed sequence of each odd length, is this entry's own):
    sequences are h : Fin n → ℤ, the aperiodic autocorrelation is indexed over Fin (n - k), and the
    Barker condition is |C(k)| <= 1 for 0 < k < n. The hypothesis heven of exists_iff_of_even and length_le_thirteen_of_even is
    the statement even_length_eq_two_or_four of openai/math with its binders, and hcirc of exists_iff_of_circulantHadamard and length_le_thirteen_of_circulantHadamard is the
    forward direction of exists_iff_order_one_or_four; nothing about them is proved.
    Schmidt and Willms index from 1 and assume n > 1; here indices start at 0 and n = 1 is included.
    Their run decomposition is replaced by the first sign change p (their s_1) and the first sign
    change not divisible by p (their s_e), as the run_bounds statement makes explicit; the
    normalization h(0) = h(1) is a hypothesis of run_bounds and is reached by the alternation in the
    proof of odd_length_mem. Turyn and Storer's Theorem 2 states only n <= 13; the list
    {1, 3, 5, 7, 11, 13} is from their introduction and Schmidt and Willms's Theorem 1.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents
    developed the proof and audited it in separate passes, the statements were checked against Schmidt and Willms's
    paper and openai/math's challenge files, and VERIFICATION.md states what is checked and what is
    not. Mechanical correctness and agreement of formal statements do not establish priority or
    significance.

alignment:
  namespace: "OddBarker"
  statements:
    - source: "Turyn–Storer 1961, Theorem 2 with the list of the introduction; Schmidt–Willms 2016, Theorem 1"
      lean: "OddBarker.odd_length_mem"
      module: "Solution"
      status: "proved"
      note: "A Barker sequence of odd length n has n in {1, 3, 5, 7, 11, 13}."
    - source: "Turyn–Storer 1961, introduction; Schmidt–Willms 2016, Theorem 1 with the known sequences"
      lean: "OddBarker.odd_exists_iff"
      module: "Solution"
      status: "proved"
      note: "For odd n, a Barker sequence of length n exists if and only if n is in {1, 3, 5, 7, 11, 13}."
    - source: "Schmidt–Willms 2016, introduction (the known sequences A3 to A13, with the transformation A(k) -> A(k)(-1)^(a+bk)); Turyn–Storer 1961, introduction"
      lean: "OddBarker.unique"
      module: "Solution"
      status: "proved"
      note: "For odd n, a Barker sequence of length n is ±canon n or ±(-1)^j canon n: the listed sequence of its length up to negation and alternation, by a kernel enumeration of the 2^n sign patterns at each of the six lengths."
    - source: "Schmidt–Willms 2016, Lemma 2 (after Turyn–Storer)"
      lean: "OddBarker.aperiodic_eq"
      module: "Solution"
      status: "proved"
      note: "For odd n, C(k) = 0 for odd k and C(k) = (-1)^((n - 1)/2) for even k, 0 < k < n."
    - source: "Schmidt–Willms 2016, Lemma 2(i), 0-indexed"
      lean: "OddBarker.skew"
      module: "Solution"
      status: "proved"
      note: "For odd n, h(k) h(n - 1 - k) = (-1)^((n - 1)/2 + k)."
    - source: "This development; the equations (k) of Turyn–Storer's Theorem 1 are its half-sums"
      lean: "OddBarker.fold"
      module: "Solution"
      status: "proved"
      note: "For odd n and even w <= n - 3, the sum over k <= w of (-1)^k h(k) h(w - k) is 1."
