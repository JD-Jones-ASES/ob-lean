    aperiodic autocorrelations, skew-symmetry, the folded identity, the doubling law and the run
    bounds of Schmidt and Willms's Lemmas 3 and 4; for even n > 2, 4 | n and a real circulant
    Hadamard matrix of order n. Conditional on the even-length classification, taken as an explicit
    hypothesis: Barker sequences of positive length exist exactly at 1, 2, 3, 4, 5, 7, 11, 13, and
    every Barker sequence has length at most 13; the same two, conditional on the statement that real
    circulant Hadamard matrices of positive order exist only at orders 1 and 4. Not claimed: the
    even-length classification and the circulant Hadamard statement themselves; Turyn and Storer's
    Theorem 1; the uniqueness of the odd-length sequences. The intentional placeholders of
