version: "v0.4"

project:
  name: "Barker sequences of odd length: for odd n, a Barker sequence of length n exists if and only if n is 1, 3, 5, 7, 11 or 13 (Turyn–Storer, by the proof of Schmidt–Willms); given the even-length classification, Barker sequences exist exactly at the lengths 1, 2, 3, 4, 5, 7, 11 and 13"
  description: >-
    A Lean 4 development of the classification of Barker sequences of odd length. A Barker sequence
    of length n is a sequence h of n signs whose aperiodic autocorrelations C(k), the sum over
    j < n - k of h(j) h(j + k), satisfy |C(k)| <= 1 for 0 < k < n. Turyn and Storer (1961) proved
    that a Barker sequence of odd length has length 1, 3, 5, 7, 11 or 13. Theorem 1(iv) of
    Turyn–Storer is false as stated (Willms 2014); per Schmidt–Willms the induction survives with a
    corrected range; the theorem itself was never in doubt. The proof formalized is that of Schmidt
    and Willms (2016), recast so that no case enumeration is needed: for odd n and m = (n - 1)/2, odd
    shifts have autocorrelation 0 and even shifts (-1)^m (from C(u) + C(n - u) = n mod 4);
    skew-symmetry h(k) h(n - 1 - k) = (-1)^(m + k); the folded identity, the sum over k <= w of
    (-1)^k h(k) h(w - k), equals 1 for every even w <= n - 3; the doubling law
    h(u - 1) h(u) = h(2u - 1) h(2u) for 1 <= u <= (n - 3)/2; Schmidt and Willms's Lemmas 3 and 4 in
    sign-change form (for n >= 7 and h(0) = h(1), with p the first sign change and q the first sign
    change not divisible by p, both are odd and 2q - 3 <= n <= p + q + 1, Lemma 4 by one
    generating-function identity for the folded sums); and an endgame that leaves n in {7, 11, 13},
    excluding n = 9 by skew-symmetry and doubling, with the alternation h(j) -> (-1)^j h(j) for the
    normalization h(0) = h(1); the eight sequences of lengths 1, 2, 3, 4, 5, 7, 11 and 13 are Barker
    by decide. Also proved: the even reduction of Turyn and Storer's footnote 2, that a Barker
    sequence of even length n > 2 has 4 | n and yields a real circulant Hadamard matrix of order n.
    Given the even-length classification as an explicit hypothesis (every Barker sequence of positive
    even length has length 2 or 4, the statement even_length_eq_two_or_four of openai/math, family
    179), a Barker sequence of positive length n exists exactly when n is 1, 2, 3, 4, 5, 7, 11 or 13,
    and every Barker sequence has length at most 13; the same follows from the hypothesis that real
    circulant Hadamard matrices of positive order exist only at orders 1 and 4 (the forward direction
    of exists_iff_order_one_or_four of openai/math), through the even reduction. The seven
    definitions are restated character for character from openai/math's two challenge files, so its
    two theorems discharge the hypotheses by unfolding alone; they are not proved here. The restated
    definitions and the adapted parts named in NOTICE derive from Apache-2.0 work of OpenAI (NOTICE,
    LICENSES/Apache-2.0.txt); the rest is MIT.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

