sources:
  - title: "On binary sequences"
    authors: ["R. Turyn", "J. Storer"]
    id: "doi:10.1090/S0002-9939-1961-0125026-2"
    type: "paper"
    location: "Proceedings of the American Mathematical Society 12 (1961), no. 3, 394-399; the introduction (p. 394: the known sequences and the claim that for odd n they are all), footnote 2 (p. 395: the even reduction), Theorem 1 (p. 396), Theorem 2 (p. 398: odd n implies n <= 13) and the reconstruction closing its proof (pp. 398-399)"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The classical source of the theorem formalized here: Theorem 2 bounds an odd Barker length by 13,
      and the introduction, with the reconstruction that closes the proof, gives the exact list of odd
      lengths 3, 5, 7, 11, 13 that odd_length_mem and odd_exists_iff state (with the trivial length 1
      added). The relationship is "other" because the statement is this paper's while the proof
      formalized is that of Schmidt and Willms below; nothing of the inductive proof of Theorem 2 through Theorem 1 is formalized or relied on (part (iv) of
      Theorem 1 is false as stated; see Willms below). Two smaller pieces originate here: the
      skew-symmetry and doubling identities, which Schmidt and Willms credit to this paper as their
      Lemma 2 and which are proved here by their short proofs (skew, doubling); and footnote 2, the
      reduction of an even Barker sequence of length above 2 to length divisible by 4 with vanishing
      periodic autocorrelation, which is proved here (four_dvd_of_even,
      existsRealCirculantHadamard_of_even) along the route of the openai/math Lean files cited below.
  - title: "Barker sequences of odd length"
    authors: ["Kai-Uwe Schmidt", "Jürgen Willms"]
    id: "doi:10.1007/s10623-015-0104-4"
    type: "paper"
    location: "Designs, Codes and Cryptography 80 (2016), no. 2, 409-414 (online 2015-06-16); arXiv:1501.06035 (v1, 2015-01-24, pp. 2-6): Theorem 1, Lemma 2 (i) and (ii), Lemma 3, Lemma 4 and the three cases that complete the proof of Theorem 1; footnote 1"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The proof formalized. Lemma 2 (i) and (ii) are the theorems skew and doubling (with the parity
      step of its proof as aperiodic_eq); Lemma 3 and Lemma 4 are run_bounds (2q - 3 <= n <= p + q + 1,
      p and q odd, where p is the length of the first run and q the first run boundary not divisible by
      p); the cases that complete the proof give n in {7, 11, 13} for n >= 7. The relationship is
      "adapts" because the argument is recast rather than transcribed (see PROOF.md): positions are
      indexed from 0 and runs are handled through the positions where the sign changes, and Lemma 4
      is proved in a sign-change form from two values of a folded autocorrelation sum (the theorem
      fold). The paper's convention n > 1 is widened to admit n = 1. Footnote 1 records that Theorem
      1 (iv) of Turyn and Storer fails as stated and that their induction survives on a corrected
      range; nothing of that repair is formalized.
  - title: "Counterexamples to Theorem 1 of Turyn's and Storer's Paper \"On Binary Sequences\""
    authors: ["Jürgen Willms"]
    id: "arXiv:1404.4833"
    type: "paper"
    location: "https://arxiv.org/abs/1404.4833 (v2, 2014-07-05), Sections 2 and 3"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Explicit sequences for which the hypotheses of Theorem 1 of Turyn and Storer hold and its part
      (iv) fails, so the published proof of their Theorem 2 is incomplete as written. Cited for the
      status of the 1961 proof; nothing from it is formalized.
  - title: "Run Vector Analysis and Barker Sequences of Odd Length"
    authors: ["Jürgen Willms"]
    id: "arXiv:1409.1434"
    type: "paper"
    location: "https://arxiv.org/abs/1409.1434 (v2, 2014-10-30)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Another proof of the odd-length theorem through the run vector of a skew-symmetric binary
      sequence; the arXiv record of Schmidt and Willms says their note supersedes its main result. Background only.
  - title: "Autocorrelations of Binary Sequences and Run Structure"
    authors: ["Jürgen Willms"]
    id: "doi:10.1109/TIT.2013.2259293"
    type: "paper"
    location: "IEEE Transactions on Information Theory 59 (2013), no. 8, 4985-4993"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Relates the runs of a binary sequence to its aperiodic autocorrelations; Schmidt and Willms cite
      it for the run viewpoint their proof uses. Background only.
  - title: "A note on Barker polynomials"
    authors: ["Peter Borwein", "Tamás Erdélyi"]
    id: "doi:10.1142/S179304211250159X"
    type: "paper"
    location: "International Journal of Number Theory 9 (2013), no. 3, 759-767; arXiv:1206.5371"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      A different proof that no Barker sequence of odd length above 13 exists, through Barker
      polynomials of even degree. Background only; nothing from it is formalized.
  - title: "What can be used instead of a Barker sequence?"
    authors: ["Jonathan Jedwab"]
    id: "doi:10.1090/conm/461/08991"
    type: "paper"
    location: "In: G. L. Mullen, D. Panario, I. E. Shparlinski (eds.), Finite Fields and Applications, Contemporary Mathematics 461 (2008), 153-178; Section 1, Theorem 1.2"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Survey of Barker sequences and their alternatives; its Theorem 1.2 states the odd-length theorem
      after Turyn and Storer, before the gap in their proof was reported. Background only.
  - title: "Barker sequences and flat polynomials"
    authors: ["Peter Borwein", "Michael J. Mossinghoff"]
    id: "doi:10.1017/CBO9780511721274.007"
    type: "paper"
    location: "In: J. McKee, C. Smyth (eds.), Number Theory and Polynomials, London Mathematical Society Lecture Note Series 352, Cambridge University Press (2008), 71-88"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Survey of Barker sequences, the even case and flat polynomials. Background only."
  - title: "openai/math (family 179: The circulant Hadamard and Barker-sequence conjectures)"
    authors: ["OpenAI"]
    id: "https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a"
    type: "other"
    location: "lean/ComparatorChallenges/EvenBarker.lean (OAI.CirculantHadamard.Barker.even_length_eq_two_or_four), lean/ComparatorChallenges/CirculantHadamard.lean (OAI.CirculantHadamard.exists_iff_order_one_or_four), lean/OAI/LinearAlgebra/Barker/ and lean/docs/179.md, at commit adc7f1241b42e322a6451854ab7e4b4c146bf78a (these files unchanged at fd4aeeb2ee4f); Apache-2.0"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The definitions IsSign, aperiodic and IsBarker (from EvenBarker.lean) and RealMatrix,
      IsCirculant, IsSignHadamard and ExistsRealCirculantHadamard (from CirculantHadamard.lean) are
      restated character for character in Challenge.lean with the namespace changed, so that the two
      theorems named here discharge by unfolding the hypotheses of the conditional theorems: heven of
      exists_iff_of_even and length_le_thirteen_of_even is the statement of
      even_length_eq_two_or_four, and hcirc of exists_iff_of_circulantHadamard and
      length_le_thirteen_of_circulantHadamard is the forward direction of
      exists_iff_order_one_or_four. Those two theorems are hypotheses here; they are not imported or
      re-proved. The even reduction in OB/Hadamard.lean follows the
      route of lean/OAI/LinearAlgebra/Barker/ (the lemmas whose docstrings say so are modified from it;
      see NOTICE). The project's scope note states that the odd-length classification is outside its
      Lean formalization; that classification is what this repository adds.
  - title: "The circulant Hadamard conjecture"
    authors: ["OpenAI"]
    id: "https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/The-circulant-Hadamard-conjecture-September-23-2026/paper.pdf"
    type: "paper"
    location: "openai/math, family 179, preprint dated 2026-09-23; Theorem 1.1, Corollary 1.2, Section 5"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Theorem 1.1 (a real circulant Hadamard matrix of positive order n exists only for n = 1 and
      n = 4) is the statement taken as the hypothesis hcirc; Corollary 1.2 is the full classification
      of Barker lengths, whose odd half the paper cites from Turyn and Storer and from Schmidt and
      Willms without proof. Nothing of the paper's proof of Theorem 1.1 is formalized or relied on.
  - title: "Formal Conjectures: BarkerSequence.lean (barker_conjecture)"
    authors: ["The Formal Conjectures Authors"]
    id: "https://github.com/google-deepmind/formal-conjectures/blob/87d97fa7626c7b39ee4c8565d3acfa5a048d6cae/FormalConjectures/Arxiv/2104.00502/BarkerSequence.lean"
    type: "other"
    location: "FormalConjectures/Arxiv/2104.00502/BarkerSequence.lean, theorem barker_conjecture (tagged research open, proof sorry), added in pull request #4793; issue #6917 (open as of 2026-10-09)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      States the Barker conjecture (every Barker sequence, as a List ℤ, has length at most 13) as an
      open problem in its own vocabulary. This repository proves the odd-length case and, given the
      statement of OpenAI's EvenBarker or CirculantHadamard theorem, the conjecture in the Fin n → ℤ
      vocabulary of openai/math; no bridge to the List ℤ statement is formalized. Background only.
